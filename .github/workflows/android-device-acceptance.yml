name: Android device acceptance
on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/ci_device_acceptance.sh'
      - '.github/workflows/android-device-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Prepare cloud toolchain
        run: bash .devcontainer/setup.sh
      - name: Enable host KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Real Android 35 emulator and persisted-data acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: Shiye_024_API35
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci_device_acceptance.sh
      - name: Preserve on-device screenshots, log and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v024-real-device-${{ github.sha }}
          path: app/build/outputs/v024-device/
          retention-days: 3
          if-no-files-found: warn
