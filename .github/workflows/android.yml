name: android

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: 装齐 Android SDK 平台与构建工具
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 逻辑单测
        run: bash ./gradlew :app:testDebugUnitTest --console=plain

      - name: 出调试与验收包
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
        # 不往 Actions 里存 APK 产物：安装包走 Release（发布脚本会挂上去），
        # 存这里会占账号的 artifact 配额，配额满了会让整个 CI 变红。

  storage-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install Android SDK platform
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify atomic replacement and existing-record compatibility
        shell: pwsh
        run: |
          ./gradlew.bat :app:testDebugUnitTest --tests 'cn.jiaoban.data.TaskStoreTest' --tests 'cn.jiaoban.data.JournalCompatibilityTest' --tests 'cn.jiaoban.data.TasksHolderTest' --console=plain --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8'
          exit $LASTEXITCODE
