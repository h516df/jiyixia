name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 装齐 Android SDK 平台与构建工具
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 逻辑单测
        run: bash ./gradlew :app:testDebugUnitTest --console=plain

      - name: 出调试与验收包
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
        # 不往 Actions 里存 APK 产物：安装包走 Release（发布脚本会挂上去），
        # 存这里会占账号的 artifact 配额，配额满了会让整个 CI 变红。
