name: Private development APK

on:
  workflow_dispatch:
  push:
    branches: ['delivery/**']

permissions:
  contents: read

concurrency:
  group: private-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'h516df/jiyixia' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Prepare existing cloud toolchain
        run: bash .devcontainer/setup.sh
      - name: Test
        run: |
          source .cloud/env.sh
          bash ./gradlew --no-daemon --max-workers=1 :app:testDebugUnitTest
      - name: Build development APKs
        run: |
          source .cloud/env.sh
          bash ./gradlew --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Lint
        run: |
          source .cloud/env.sh
          bash ./gradlew --no-daemon --max-workers=1 :app:lintDebug
      - name: Check delivery safeguards
        run: python3 -m unittest discover -s cloud -p 'test_deliver_apk.py' -v
      - name: Verify APK signature and package
        run: |
          source .cloud/env.sh
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk > .cloud/apk-badging.txt
          sed -n '1p' .cloud/apk-badging.txt
      - name: Deliver private draft and verify downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/deliver_apk.py
      - name: Explain delivery failure
        if: failure()
        run: |
          echo '::error::Development APK delivery is incomplete. Inspect Test, Build, Lint, and delivery steps separately. No installable upgrade or completed delivery is claimed.'
          echo 'Development APK delivery failed. Any partial draft is preserved; nothing is published or deleted. Cloud workspace fallback: bash cloud/check.sh; output app/build/outputs/apk/debug/app-debug.apk.' >> "$GITHUB_STEP_SUMMARY"
