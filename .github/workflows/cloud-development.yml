name: Cloud development
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Public release to verify anonymously
        required: true
        type: choice
        options: [source, mirror]
permissions:
  contents: read
jobs:
  anonymous-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact public assets without credentials
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          stage = os.environ["RELEASE_STAGE"]
          assert stage in ("source", "mirror")
          repo, tag = ("h516df/jiyixia", "v0.20") if stage == "source" else ("h516df/app-releases", "jiyixia-stable-v0.20")
          expected = {
            "Jiaoban-v0.20-universal.apk": (2973621, "2191b1f45416a85a71c1475d85fd19f8d879ab27610330b42290d2585f97fd8c"),
            "Jiaoban-v0.20-release-notes.json": (610, "fe774a48a28c78211fdc8fa561373519efb90604c0ce623a9424c11a7980dfe9"),
            "Jiaoban-v0.20-SHA256.txt": (95, "025882a6269bc77670a01cdb0047b8fa085be7822ba9ce577fc4944fad1ec66c")
          }
          out = pathlib.Path("verified"); out.mkdir()
          rows = []
          for name, (size, digest) in expected.items():
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              dest = out / name
              subprocess.run(["curl", "--fail", "--silent", "--show-error", "--location",
                  "--proto", "=https", "--proto-redir", "=https", "--connect-timeout", "15",
                  "--max-time", "150", "--output", str(dest), url], check=True, timeout=155)
              actual = hashlib.sha256(dest.read_bytes()).hexdigest()
              assert dest.stat().st_size == size and actual == digest
              rows.append(dict(name=name, size=size, sha256=actual, url=url))
          proof = dict(repository=repo, tag=tag, anonymousDownload=True, authorizationHeaderSent=False,
              downloadedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(), assets=rows)
          (out / "anonymous-download.json").write_text(json.dumps(proof, indent=2) + "\n")
          print(json.dumps(proof))
          PY
      - name: Preserve only verified public files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anonymous-${{ inputs.stage }}-${{ github.run_id }}
          path: verified/*
          retention-days: 3
          if-no-files-found: error
